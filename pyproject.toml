[project]
name = "quantum-lbm"
version = "0.1.0"
description = "2D D2Q9 classical Shan-He and quantum Yang-Hung LBM for cylinder flow"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ideal-gases[tables]>=0.1.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pysqlite3>=0.6.0",
    "typer>=0.16.0",
]

[project.scripts]
lbm = "lbm.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/lbm/cli.py" = ["B008"]
